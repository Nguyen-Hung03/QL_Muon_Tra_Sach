<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh sách sách')}"></head>
<body>
<header th:replace="~{fragments/layout :: nav('books')}"></header>
<main class="page">
    <div class="page-head">
        <div>
            <p class="eyebrow">Kho sách</p>
            <h1>Danh sách sách</h1>
        </div>
        <a th:href="@{/books/new}" class="btn btn-ink">Thêm sách</a>
    </div>
    <section class="panel">
        <div class="panel-body">
            <div th:replace="~{fragments/layout :: alerts}"></div>
            <form th:action="@{/books}" method="get" class="toolbar">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control"
                       placeholder="Tìm theo tên, tác giả, ISBN hoặc thể loại">
                <button type="submit" class="btn btn-outline-secondary">Tìm</button>
            </form>
            <div class="table-responsive">
                <table class="table data-table">
                    <thead>
                    <tr>
                        <th>ISBN</th>
                        <th>Sách</th>
                        <th>Thể loại</th>
                        <th>Tổng</th>
                        <th>Sẵn có</th>
                        <th>Trạng thái</th>
                        <th></th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.isbn}"></td>
                        <td>
                            <strong th:text="${book.title}"></strong>
                            <div class="text-muted small" th:text="${book.author}"></div>
                        </td>
                        <td th:text="${book.category != null ? book.category.name : 'Chưa phân loại'}"></td>
                        <td th:text="${book.totalQuantity}"></td>
                        <td th:text="${book.availableQuantity}"></td>
                        <td>
                            <span th:if="${book.status}" class="pill pill-ok">Đang phục vụ</span>
                            <span th:unless="${book.status}" class="pill pill-bad">Ngừng phục vụ</span>
                        </td>
                        <td>
                            <div class="actions">
                                <a th:href="@{/books/{id}/edit(id=${book.id})}" class="btn btn-sm btn-outline-secondary">Sửa</a>
                                <form th:action="@{/books/{id}(id=${book.id})}" th:method="delete"
                                      onsubmit="return confirm('Xóa cuốn sách này?')">
                                    <button type="submit" class="btn btn-sm btn-outline-danger">Xóa</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(books)}">
                        <td colspan="7" class="empty">Không tìm thấy sách phù hợp.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
            <nav th:if="${totalPages > 1}" class="mt-3">
                <ul class="pagination justify-content-center mb-0">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/books(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                        th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/books(page=${i}, keyword=${keyword})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/books(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </section>
</main>
</body>
</html>
