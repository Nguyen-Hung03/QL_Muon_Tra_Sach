<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">
<head th:fragment="head(pageTitle)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Thư viện</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,560&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<header th:fragment="nav(active)" class="topbar">
    <a class="brand" th:href="@{/books}">Thư viện <span>nội bộ</span></a>
    <nav class="menu">
        <a th:href="@{/books}" th:classappend="${active == 'books'} ? 'active'">Sách</a>
        <a th:href="@{/members}" th:classappend="${active == 'members'} ? 'active'">Thành viên</a>
        <a th:href="@{/borrowings}" th:classappend="${active == 'borrowings'} ? 'active'">Phiếu mượn</a>
        <a th:href="@{/reports}" th:classappend="${active == 'reports'} ? 'active'">Báo cáo</a>
    </nav>
</header>
<div th:fragment="alerts">
    <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>
    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>
</div>
</body>
</html>
